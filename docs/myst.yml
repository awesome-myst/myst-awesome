# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: 1a8d1012-58dc-4f74-afcd-7878dbccaa06
  title: MyST Awesome
  description: MyST-MD site theme built with Web Awesome.
  keywords: ["myst", "myst-md", "theme", "webawesome", "shoelace", "astro", "book", "furo"]
  github: "https://github.com/awesome-myst/myst-awesome"
  license:
    code: MIT
    content: CC-BY-4.0
  references:
    python: https://docs.python.org/3.13/
    jupyterbook: https://jupyterbook.org/en/stable/
    jtex: https://mystmd.org/jtex/
    spec: https://mystmd.org/spec/
  plugins:
    - src/directives.mjs
  toc:
    - file: index.md
    - title: Customization
      children:
        - file: customization/site-options.md
        - file: customization/themes.md
    - title: Authoring
      children:
        - file: authoring/typography.md
        - file: authoring/admonitions.md
    - title: Roadmap
      children:
        - file: roadmap/index.md
        - file: roadmap/01-dependency-updates.md
        - file: roadmap/02-core-ast-parity.md
        - file: roadmap/03-cross-references-and-numbering.md
        - file: roadmap/04-citations-and-bibliography.md
        - file: roadmap/05-ui-extension-components.md
        - file: roadmap/06-proofs-exercises.md
        - file: roadmap/07-code-execution-and-outputs.md
        - file: roadmap/08-figures-media-diagrams.md
        - file: roadmap/09-includes-glossaries-indices.md
        - file: roadmap/10-frontmatter-site-metadata.md
        - file: roadmap/11-search-navigation-toc.md
        - file: roadmap/12-myst-zod-updates.md
        - file: roadmap/13-testing-strategy.md

site:
  title: MyST Awesome
  options:
    favicon: assets/favicon.ico
    logo: assets/logo.png
    base_dir: book  # Base directory for book pages (can be overridden with BASE_DIR env var)
